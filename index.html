<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mee Overlay · Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontcss" rel="stylesheet" href="">
<link rel="stylesheet" href="render.css">
<style>
  :root {
    --bg:#0e1015; --panel:#161a22; --panel2:#1d222c; --line:#2b313d; --ink:#eef0f4; --muted:#98a0ae;
    --accent:#ff4d3d; --accent2:#ffb020; --ok:#34c77b; --sel:#3aa0ff;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 'Noto Sans Lao','Phetsarath OT',system-ui,sans-serif; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  [hidden] { display:none !important; }

  /* ---------- login ---------- */
  .login { max-width:380px; margin:10vh auto; padding:0 16px; display:flex; flex-direction:column; gap:12px; }
  .login h1 { margin:0; font-size:26px; }
  .login p { margin:0; color:var(--muted); }

  /* ---------- app shell ---------- */
  .app { height:100%; display:grid; grid-template-rows:auto 1fr; }
  .top { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top,0px));
    background:var(--panel); border-bottom:1px solid var(--line); }
  .brand { font-weight:700; letter-spacing:.02em; margin-right:6px; white-space:nowrap; }
  .brand b { color:var(--accent); }
  .grow { flex:1 1 auto; }
  .main { display:grid; grid-template-columns:1fr 360px; min-height:0; }
  .previewWrap { position:relative; min-height:0; display:flex; flex-direction:column; }
  .addbar { display:flex; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center; }
  .preview { position:relative; flex:1 1 auto; min-height:260px; overflow:hidden; touch-action:none;
    background:#0a0c10; }
  .canvasBg { position:absolute; background-color:#2a2f38;
    background-image:linear-gradient(45deg,#323843 25%,transparent 25%,transparent 75%,#323843 75%),linear-gradient(45deg,#323843 25%,transparent 25%,transparent 75%,#323843 75%);
    background-size:40px 40px; background-position:0 0,20px 20px; box-shadow:0 0 0 1px #3a4150; }
  .preview .mee-stage { overflow:visible; }
  .mee-editor .ml { cursor:move; }
  .mee-editor .ml.ed-hidden { opacity:.28 !important; outline:3px dashed rgba(255,255,255,.5); }
  .guide { position:absolute; background:#ff3bd4; pointer-events:none; z-index:9998; }
  .sel { position:absolute; border:3px solid var(--sel); pointer-events:none; z-index:9999; transform-origin:50% 50%; }
  .sel .h { position:absolute; width:28px; height:28px; margin:-14px 0 0 -14px; background:#fff; border:3px solid var(--sel); border-radius:50%;
    pointer-events:auto; touch-action:none; transform:scale(var(--inv,1)); }
  .sel .h.tl { left:0; top:0; cursor:nwse-resize; } .sel .h.tr { left:100%; top:0; cursor:nesw-resize; }
  .sel .h.bl { left:0; top:100%; cursor:nesw-resize; } .sel .h.br { left:100%; top:100%; cursor:nwse-resize; }
  .sel .h.rot { left:50%; top:0; margin-top:calc(-14px - 60px * var(--inv,1)); background:var(--sel); cursor:grab; }
  .sel .stem { position:absolute; left:50%; top:calc(-60px * var(--inv,1)); width:3px; height:calc(60px * var(--inv,1)); margin-left:-1.5px; background:var(--sel); }
  .sel.locked { border-style:dashed; border-color:#888; }
  .sel.locked .h { display:none; }
  .sel.locked .stem { display:none; }
  .zoomInfo { position:absolute; right:10px; bottom:8px; font-size:12px; color:var(--muted); pointer-events:none; }

  /* ---------- side panel ---------- */
  .side { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .tabs { display:flex; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; padding:12px 6px; background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); font-weight:600; }
  .tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
  .pane { overflow:auto; padding:12px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; }
  .grp { background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .grp h3 { margin:0; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row > label { min-width:84px; color:var(--muted); font-size:13px; }
  .row input[type=range] { flex:1 1 120px; accent-color:var(--accent); }
  .row output { min-width:40px; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
  .num4 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .num4 label { display:flex; flex-direction:column; font-size:11px; color:var(--muted); gap:2px; }
  input[type=text], input[type=email], input[type=password], input[type=number], select, textarea {
    background:#0b0d12; border:1px solid var(--line); border-radius:9px; padding:9px 10px; width:100%; min-width:0; }
  textarea { min-height:84px; resize:vertical; }
  input[type=color] { width:44px; height:36px; border:1px solid var(--line); border-radius:8px; background:#0b0d12; padding:2px; }
  .btn { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 14px; min-height:40px; font-weight:600; }
  .btn:hover { border-color:#4a5263; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.live { background:#e0261b; border-color:#e0261b; color:#fff; }
  .btn.on { background:#243b2e; border-color:var(--ok); color:#bff0d3; }
  .btn.warn { color:#ff8a80; }
  .btn.sm { min-height:34px; padding:6px 10px; font-size:13px; }
  .btn:focus-visible, .tabs button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--sel); outline-offset:1px; }
  .seg { display:flex; flex-wrap:wrap; gap:4px; }
  .seg button { background:#0b0d12; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; }
  .seg button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:4px 10px; border-radius:999px; background:#0b0d12; border:1px solid var(--line); white-space:nowrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:#777; }
  .dot.ok { background:var(--ok); } .dot.bad { background:#ff5a4f; }
  .livebadge { background:#e0261b; color:#fff; font-weight:700; }
  .livebadge .dot { background:#fff; animation:bl 1s steps(1) infinite; }
  @keyframes bl { 50% { opacity:0; } }

  /* layer list */
  .layers { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .layers li { display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--line);
    border-radius:10px; background:var(--panel2); cursor:pointer; }
  .layers li.sel { border-color:var(--sel); box-shadow:0 0 0 1px var(--sel) inset; }
  .layers .nm { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .layers .nm small { display:block; color:var(--muted); font-size:12px; }
  .eye { width:44px; height:36px; border-radius:8px; border:1px solid var(--line); background:#0b0d12; font-size:16px; }
  .eye.on { background:#243b2e; border-color:var(--ok); }
  .thumbs { display:flex; flex-wrap:wrap; gap:6px; }
  .thumbs .t { position:relative; width:64px; height:64px; border-radius:8px; background:#0b0d12 center/contain no-repeat; border:1px solid var(--line); }
  .thumbs .t button { position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:50%; border:0; background:#e0261b; color:#fff; font-size:12px; line-height:1; }
  .thumbs .t .mv { right:auto; left:-6px; background:#3a4150; }

  /* live tab */
  .liveList { display:flex; flex-direction:column; gap:8px; }
  .liveItem { display:flex; flex-direction:column; gap:6px; border:1px solid var(--line); background:var(--panel2); border-radius:12px; padding:10px; }
  .liveItem .hd { display:flex; align-items:center; gap:10px; }
  .liveItem .hd .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .switch { width:74px; height:40px; border-radius:999px; border:1px solid var(--line); background:#0b0d12; position:relative; flex:0 0 auto; }
  .switch::after { content:''; position:absolute; top:4px; left:4px; width:30px; height:30px; border-radius:50%; background:#6b7280; transition:left .15s ease, background .15s ease; }
  .switch[aria-checked="true"] { background:#1f3b2b; border-color:var(--ok); }
  .switch[aria-checked="true"]::after { left:38px; background:var(--ok); }
  .sceneBtns { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:6px; }
  .sceneBtns .btn[aria-pressed="true"] { background:#e0261b; border-color:#e0261b; color:#fff; }

  .toast { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#222834; border:1px solid var(--line);
    padding:10px 16px; border-radius:10px; font-size:14px; z-index:100000; opacity:0; transition:opacity .2s ease; pointer-events:none; max-width:90vw; }
  .toast.on { opacity:1; }
  .confirm { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }

  @media (max-width: 900px) {
    .main { grid-template-columns:1fr; grid-template-rows:minmax(300px,48vh) 1fr; }
    .side { border-left:0; border-top:1px solid var(--line); }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>

<!-- ============ login ============ -->
<form class="login" id="login" hidden>
  <h1>Mee Overlay Studio</h1>
  <p>ເຂົ້າສູ່ລະບົບເພື່ອແກ້ໄຂ ແລະ ຄວບຄຸມ overlay.</p>
  <label class="muted" for="lg-email">ອີເມວ</label>
  <input type="email" id="lg-email" autocomplete="username" required>
  <label class="muted" for="lg-pass">ລະຫັດຜ່ານ (ຢ່າງໜ້ອຍ 6 ຕົວ)</label>
  <input type="password" id="lg-pass" autocomplete="current-password" minlength="6" required>
  <button class="btn primary" type="submit" id="lg-in">ເຂົ້າສູ່ລະບົບ</button>
  <button class="btn" type="button" id="lg-up">ສ້າງບັນຊີໃໝ່</button>
  <p id="lg-msg" class="muted" role="status"></p>
</form>

<!-- ============ app ============ -->
<div class="app" id="app" hidden>
  <div class="top">
    <span class="brand"><b>Mee</b> Overlay</span>
    <select id="sceneSel" aria-label="ເລືອກໜ້າຈໍ" style="width:auto;min-width:150px"></select>
    <button class="btn sm" id="sceneNew" type="button">＋ ໜ້າຈໍ</button>
    <button class="btn sm" id="sceneMore" type="button" aria-expanded="false">⋯</button>
    <div class="seg" role="group" aria-label="ທິດທາງ">
      <button type="button" data-or="land" aria-pressed="true">▭ ແນວນອນ</button>
      <button type="button" data-or="port" aria-pressed="false">▯ ແນວຕັ້ງ</button>
    </div>
    <span class="grow"></span>
    <span class="pill" id="netPill"><span class="dot" id="netDot"></span><span id="netTxt">…</span></span>
    <button class="btn sm" id="liveBtn" type="button">ຂຶ້ນ live</button>
    <button class="btn sm" id="hideAllBtn" type="button">ເຊື່ອງທັງໝົດ</button>
    <button class="btn sm" id="linkBtn" type="button">ລິ້ງ overlay</button>
    <button class="btn sm" id="outBtn" type="button" title="ອອກຈາກລະບົບ">ອອກ</button>
  </div>
  <div class="top" id="sceneMenu" hidden>
    <label class="muted" for="sceneName">ຊື່ໜ້າຈໍ</label>
    <input type="text" id="sceneName" style="max-width:240px">
    <button class="btn sm" id="sceneDup" type="button">ສຳເນົາໜ້າຈໍ</button>
    <span class="confirm" id="sceneDelWrap"><button class="btn sm warn" id="sceneDel" type="button">ລຶບໜ້າຈໍນີ້</button></span>
    <span class="grow"></span>
    <span class="muted" id="linkShow" style="word-break:break-all;user-select:all"></span>
  </div>

  <div class="main">
    <div class="previewWrap">
      <div class="addbar">
        <button class="btn primary" id="addText" type="button">＋ ຂໍ້ຄວາມ</button>
        <button class="btn primary" id="addImage" type="button">＋ ຮູບ</button>
        <input type="file" id="fileImg" accept="image/*" multiple hidden>
        <span class="grow"></span>
        <span class="muted">ລາກເພື່ອຍ້າຍ · ຈຸດມຸມ = ປັບຂະໜາດ · ຈຸດເທິງ = ໝຸນ</span>
      </div>
      <div class="preview" id="preview">
        <div class="canvasBg" id="canvasBg"></div>
        <div class="mee-stage mee-editor" id="stage"></div>
        <span class="zoomInfo" id="zoomInfo"></span>
      </div>
    </div>

    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-layers" aria-selected="true" type="button">ຊັ້ນ</button>
        <button role="tab" id="tab-props" aria-selected="false" type="button">ປັບແຕ່ງ</button>
        <button role="tab" id="tab-live" aria-selected="false" type="button">ຄວບຄຸມ Live</button>
      </div>
      <div class="pane" id="pane-layers" role="tabpanel"></div>
      <div class="pane" id="pane-props" role="tabpanel" hidden></div>
      <div class="pane" id="pane-live" role="tabpanel" hidden></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="editor.js"></script>
</body>
</html>
