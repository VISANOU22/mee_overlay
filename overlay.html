<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mee Sport Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent !important; overflow:hidden; width:100%; height:100%; }
  body { font-family:'Noto Sans Lao','Lao Sangam MN','Phetsarath OT',system-ui,sans-serif; color:#fff; }
  /* design canvas 1920x1080, scaled to whatever size the app gives us */
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }
  .frame { position:absolute; inset:0; border:10px dashed rgba(255,214,0,.9); box-sizing:border-box; pointer-events:none; }
  .frame.off { display:none; }
  .live { position:absolute; left:40px; top:40px; display:flex; align-items:center; gap:14px; background:#d6281e; padding:12px 26px; border-radius:10px;
    font:700 44px/1 system-ui,sans-serif; letter-spacing:.06em; box-shadow:0 6px 18px rgba(0,0,0,.35); }
  .live i { width:20px; height:20px; border-radius:50%; background:#fff; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .clock { position:absolute; right:40px; top:40px; background:rgba(0,0,0,.6); padding:12px 24px; border-radius:10px;
    font:700 44px/1 system-ui,sans-serif; font-variant-numeric:tabular-nums; }
  .msg { position:absolute; left:50%; bottom:80px; transform:translateX(-50%) translateY(0); max-width:1600px;
    background:rgba(10,14,22,.85); border-left:12px solid var(--accent,#f5c518); padding:22px 40px; border-radius:12px;
    font-size:56px; font-weight:700; line-height:1.3; text-align:center; transition:opacity .4s ease, transform .4s ease; }
  .msg.hide { opacity:0; transform:translateX(-50%) translateY(40px); }
  .info { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; background:rgba(0,0,0,.55);
    padding:30px 50px; border-radius:16px; font-size:40px; line-height:1.5; }
  .info.off { display:none; }
  .info small { display:block; font-size:30px; opacity:.85; font-family:system-ui,sans-serif; }
  .dot { display:inline-block; width:18px; height:18px; border-radius:50%; background:#999; margin-right:10px; vertical-align:middle; }
  .dot.ok { background:#2ecc71; } .dot.bad { background:#ff3b30; }
</style>
</head>
<body>
<div id="stage">
  <div class="frame" id="frame"></div>
  <div class="live"><i></i>LIVE</div>
  <div class="clock" id="clock">00:00:00</div>
  <div class="info" id="info">
    ໜ້າທົດສອບ Overlay<br>
    ຖ້າເຫັນ<b>ພາບກ້ອງ</b>ຢູ່ຫຼັງກ່ອງນີ້ = ພື້ນໂປ່ງໃສ ✓<br>
    ຖ້າເຫັນ<b>ກອບເຫຼືອງ</b>ຄົບ 4 ດ້ານ = ຂະໜາດຖືກ ✓
    <small><span class="dot" id="dot"></span><span id="net">ກຳລັງເຊື່ອມຕໍ່…</span> · <span id="size"></span></small>
  </div>
  <div class="msg hide" id="msg"></div>
</div>
<script>
(() => {
  const topic = new URLSearchParams(location.search).get('t') || '';
  const $ = (id) => document.getElementById(id);

  // scale the 1920x1080 design to the real window
  const fit = () => {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    const st = $('stage');
    st.style.transform = 'scale(' + k + ')';
    st.style.left = ((innerWidth - 1920 * k) / 2) + 'px';
    st.style.top = ((innerHeight - 1080 * k) / 2) + 'px';
    $('size').textContent = innerWidth + '×' + innerHeight;
  };
  addEventListener('resize', fit); fit();

  const pad = (n) => String(n).padStart(2, '0');
  setInterval(() => { const d = new Date(); $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }, 250);

  // ---- state applied from the control page ----
  const apply = (s) => {
    if (!s || typeof s !== 'object') return;
    if ('text' in s) $('msg').textContent = s.text || '';
    if ('show' in s) $('msg').classList.toggle('hide', !s.show || !$('msg').textContent);
    if ('accent' in s) document.documentElement.style.setProperty('--accent', s.accent);
    if ('test' in s) { $('frame').classList.toggle('off', !s.test); $('info').classList.toggle('off', !s.test); }
  };
  const parse = (m) => { try { return JSON.parse(m); } catch (e) { return null; } };

  if (!topic) { $('net').textContent = 'ບໍ່ມີລະຫັດຊ່ອງ (?t=…) ໃນລິ້ງ'; $('dot').className = 'dot bad'; return; }

  // 1) pick up the latest state sent in the last 12 hours
  fetch('https://ntfy.sh/' + encodeURIComponent(topic) + '/json?poll=1&since=12h')
    .then(r => r.text())
    .then(t => { t.trim().split('\n').filter(Boolean).map(l => parse(l)).forEach(ev => { if (ev && ev.event === 'message') apply(parse(ev.message)); }); })
    .catch(() => {});

  // 2) live updates
  const connect = () => {
    const es = new EventSource('https://ntfy.sh/' + encodeURIComponent(topic) + '/sse');
    es.onopen = () => { $('dot').className = 'dot ok'; $('net').textContent = 'ເຊື່ອມຕໍ່ແລ້ວ'; };
    es.onmessage = (e) => { const ev = parse(e.data); if (ev && ev.event === 'message') apply(parse(ev.message)); };
    es.onerror = () => { $('dot').className = 'dot bad'; $('net').textContent = 'ຂາດການເຊື່ອມຕໍ່ — ກຳລັງລອງໃໝ່'; };
  };
  connect();
})();
</script>
</body>
</html>
