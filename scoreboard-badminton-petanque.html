    <!-- The native side can call template.update/action/save before the main
         script below has installed the real handlers (it fires as soon as the
         webview commits, not when the page finishes parsing). Without this the

         error. Queue anything that arrives early; the main script replays it
         and then posts { type: "ready" }. -->

        var queue = (window.__templateQueue = []);
        var queued = function (name) {
          return function () {
            queue.push([name, Array.prototype.slice.call(arguments)]);
          };
        };

          update: queued('update'),
          action: queued('action'),
          save: queued('save'),
        };
      })();

                  .split(',')
                  .map((v) => Number(v.trim()))
                  .map((v) => (Number.isNaN(v) ? defaultState : v))
              );
            }

            // Append defaultState for missing items to ensure the length matches fallbackCount
            while (_value.length < fallbackCount) {
              _value.push(defaultState);
            }

            return _value;
          }

          return Array.from({ length: Math.max(0, fallbackCount) }, () => defaultState);
        };

        const updateFaultItemColor = (imgEl, isSelected, fillColor, strokeColor) => {
          if (!imgEl) return;

          if (isSvg(imgEl.src)) {
            if (strokeColor) {
              setSvgColor(imgEl, 'secondaryColor', strokeColor);
            }

            setSvgColor(
              imgEl,
              'primaryColor',
              isSelected ? fillColor : 'transparent',
            );
            return;
          }

          imgEl.style.opacity = isSelected ? '1' : '0.25';
        };

        const ensureRepeatedFaultItems = (containerEl, count) => {
          if (!containerEl) return [];

          if (count === 0) {
            containerEl.style.display = 'none';
            return [];
          }

          containerEl.style.display = '';
          const normalizedCount = Math.max(1, Number(count || 1));
          const widthMode = containerEl.dataset.widthMode || 'fixed';
          const anchorX = Number(containerEl.dataset.anchorX || 0.5);
          const baseWidth = Math.max(1, Number(containerEl.dataset.baseWidth || 1));
          const baseHeight = Math.max(1, Number(containerEl.dataset.baseHeight || 1));
          const repeatedGap = Math.max(0, Number(containerEl.dataset.repeatedGap || 0));
          const duplicateDirection = containerEl.dataset.duplicateDirection || 'ltr';
          const itemClass = containerEl.classList.contains('multiple-state-images')
            ? 'multiple-state-image-item'
            : 'repeated-image-item';
          const firstImg = containerEl.querySelector('.' + itemClass + ' img');
          let multipleStateSources = [];
          if (itemClass === 'multiple-state-image-item') {
            try {
              const sourcesAttr = containerEl.getAttribute('data-item-sources') || '';
              const parsed = sourcesAttr ? JSON.parse(atob(sourcesAttr)) : [];
              if (Array.isArray(parsed)) {
                multipleStateSources = parsed.filter((item) => typeof item === 'string');
              }
            } catch (error) {
              multipleStateSources = [];
            }
          }

          const baseSrc =
            containerEl.dataset.baseSrc ||
            firstImg?.getAttribute('src') ||
            '';
          if (baseSrc && !containerEl.dataset.baseSrc) {
            containerEl.dataset.baseSrc = baseSrc;
          }

          const currentItems = Array.from(
            containerEl.querySelectorAll('.' + itemClass),
          );

          if (currentItems.length < normalizedCount) {
            for (let index = currentItems.length; index < normalizedCount; index += 1) {
              const nextItem = document.createElement('div');
              nextItem.className = itemClass;
              nextItem.setAttribute('data-index', String(index));

              const itemSrc = multipleStateSources[index] || baseSrc;
              if (itemSrc) {
                const nextImg = document.createElement('img');
                nextImg.src = itemSrc;
                nextItem.appendChild(nextImg);
              }

              containerEl.appendChild(nextItem);
            }
          } else if (currentItems.length > normalizedCount) {
            currentItems.slice(normalizedCount).forEach((item) => item.remove());
          }

          if (widthMode !== 'fixed') {
            const containerWidth = baseWidth * normalizedCount + repeatedGap * (normalizedCount - 1);
            containerEl.style.width = `${containerWidth}px`;
            if (duplicateDirection === 'rtl') {
              // re-calculate left position based on anchorX for rtl direction
              const leftOffset = anchorX - containerWidth;
              containerEl.style.left = `${leftOffset}px`;
            }
          }
          containerEl.style.flexDirection = duplicateDirection === 'rtl' ? 'row-reverse' : 'row';
          containerEl.dataset.repeatedCount = String(normalizedCount);

          if (itemClass === 'multiple-state-image-item') {
            containerEl.style.width = '';
            Array.from(containerEl.querySelectorAll('.' + itemClass)).forEach((item, index) => {
              const img = item.querySelector('img');
              const itemSrc = multipleStateSources[index] || baseSrc;
              if (!img && itemSrc) {
                const nextImg = document.createElement('img');
                nextImg.src = itemSrc;
                item.appendChild(nextImg);
                return;
              }

              if (img && itemSrc && img.getAttribute('src') !== itemSrc) {
                img.setAttribute('src', itemSrc);
              }
            });
          }

          return Array.from(
            containerEl.querySelectorAll('.' + itemClass),
          );
        };

        const getMultipleStates = (el) => {
          try {
            const statesAttr = el.getAttribute('data-states');
            if (!statesAttr) return {};
            const parsed = JSON.parse(statesAttr);
            return parsed;
          } catch (error) {
            return {}
          }
        };

        const parseRunValue = (value) => {
          let parsedValue = value;

          if (typeof value === 'string') {
            try {
              parsedValue = JSON.parse(value);
            } catch (error) {
              parsedValue = null;
            }
          }

          const parsedTotal = Number(parsedValue?.total);
          const parsedCurrent = Number(parsedValue?.current);
          const total = Number.isFinite(parsedTotal)
            ? Math.max(0, parsedTotal)
            : 0;
          const current = Number.isFinite(parsedCurrent)
            ? Math.max(0, Math.min(parsedCurrent, total))
            : 0;

          return { total, current };
        };

        const _updateRepeatedFaultsView = (id, parsedValue) => {
          const num = Math.max(0, Number(parsedValue.num || 0));
          const selected = Math.max(0, Math.min(Number(parsedValue.selected || 0), num));

          const el = findElement(id);
          if (!el) return;

          const states = Array.isArray(parsedValue.states)
            ? parsedValue.states.slice(0, num).map((item) => (Number(item) === 1 ? 1 : 0))
            : null;
          const fillColor = el.getAttribute('data-fill-color');
          const strokeColor = el.getAttribute('data-stroke-color');

          const items = ensureRepeatedFaultItems(el, num);
          items.forEach((item, index) => {
            const img = item.querySelector('img');
            img.style.display = '';
            const isSelected = states ? states[index] === 1 : index < selected;
            updateFaultItemColor(img, isSelected, fillColor, strokeColor);
          });

          el.setAttribute('data-selected-count', String(selected));
        };
        const updateRepeatedFaultsView = (id, value) => {
          const matchingNumIds = {
            'teamAFaults': 'teamAFaultsNum',
            'teamBFaults': 'teamBFaultsNum',
          }

          const parsed = parseFaultValue(value);
          const num = Math.max(0, Number(parsed.num || 0));
          const selected = Math.max(0, Math.min(Number(parsed.selected || 0), num));
          if (matchingNumIds[id]) {
            updateText(matchingNumIds[id], selected);
          }
          
          _updateRepeatedFaultsView(id, parsed);
        };
        const updateMatchingTextView = (id, value) => {
          const faultMatchingFields = {
            foulA: 'teamAFaults',
            foulB: 'teamBFaults',
          };
          if (!faultMatchingFields[id]) return;
          const matchingId = faultMatchingFields[id];
          const el = findElement(matchingId);
          if (!el) return;
          const num = Math.max(0, Number(el.getAttribute('data-repeated-count') || 0));
          const parsedValue = {
            num,
            selected: Math.max(0, Math.min(Number(value || 0), num)),
          };
          _updateRepeatedFaultsView(matchingId, parsedValue);
        };

        const updateMultipleStateImagesView = ({ id, value, repeatedCount: _repeatedCount, visibleCount, visibleRatio, isInitial = false }) => {
          const el = findElement(id);
          if (!el) return;

          const repeatedCount = _repeatedCount === undefined
            ? Math.max(
                1,
                Number(el.getAttribute('data-repeated-count') || 1),
              )
            : Math.max(0, Number(_repeatedCount || 0));
          el.dataset.repeatedCount = String(repeatedCount);
          const defaultState = defaultMultipleStateElStateById[id] ?? defaultMultipleStateElStateById.default;
          const _states = parseMultipleStateValue(value, repeatedCount, defaultState);
          const strokeColor = el.dataset.strokeColor;
          const stateSrcOrColors = getMultipleStates(el);
          const stateMode = el.dataset.stateMode || 'blur';
          const duplicateDirection = el.dataset.duplicateDirection || 'ltr';
          const normalizedVisibleCount = Math.max(
            0,
            Math.min(
              Number.isFinite(Number(visibleCount))
                ? Number(visibleCount)
                : repeatedCount,
              repeatedCount,
            ),
          );
          const normalizedVisibleRatio = Number.isFinite(Number(visibleRatio))
            ? Math.max(0, Math.min(Number(visibleRatio), 1))
            : null;

          const normalizedRepeatedCount = Math.max(1, repeatedCount);
          const sliceIndex = Math.floor(
            Math.max(0, _states.length - 1) / normalizedRepeatedCount,
          ) * normalizedRepeatedCount;
          const states = _states.slice(sliceIndex);
          const items = ensureRepeatedFaultItems(el, normalizedRepeatedCount);
          items.forEach((item, index) => {
            const img = item.querySelector('img');
            const state = states[index] ?? defaultState;

            if (id === 'runTimeProcess') {
              const hiddenCount = Math.max(
                0,
                normalizedRepeatedCount - normalizedVisibleCount,
              );
              const shouldShow = normalizedVisibleRatio !== null
                ? duplicateDirection === 'rtl'
                  ? index / normalizedRepeatedCount < normalizedVisibleRatio
                  : (index + 1) / normalizedRepeatedCount > 1 - normalizedVisibleRatio
                : duplicateDirection === 'rtl'
                  ? normalizedRepeatedCount - index - 1 < normalizedVisibleCount
                  : index >= hiddenCount;

              item.style.visibility = shouldShow ? 'visible' : 'hidden';
              item.style.backgroundColor = getRunTimeProcessColor(
                index,
                normalizedRepeatedCount,
              );
              if (img) {
                img.style.display = 'none';
              }
              return;
            }

            if (id === 'pocketBalls') {
              const isShown = state === 1;
              if (img) {
                img.style.opacity = isShown
                  ? '1'
                  : stateMode === 'hidden'
                    ? '0'
                    : '0.35';
                img.style.filter = isShown
                  ? 'none'
                  : stateMode === 'hidden'
                    ? 'none'
                    : 'blur(1.5px) grayscale(100%)';
              }
              return;
            }

            const srcColorOr = stateSrcOrColors[state] || stateSrcOrColors[-1] || 'transparent';
            const isColor = srcColorOr.startsWith('#') || srcColorOr.startsWith('rgb');
            if (isColor) {
              updateFaultItemColor(img, true, srcColorOr, strokeColor);
            } else {
              img.src = srcColorOr;
            }
          });
          const mapScoreIds = {
            'penaltyScoreA': 'scoreA',
            'penaltyScoreB': 'scoreB',
          };

          if (mapScoreIds[id] && !isInitial) {
            const scoreId = mapScoreIds[id];
            const newScore = _states.reduce((acc, state) => acc + (state === 1 ? 1 : 0), 0);
            updateText(scoreId, newScore);
          }
        };

        const updateRunValueView = (value) => {
          const { total, current } = parseRunValue(value);
          const visibleRatio = total > 0 ? current / total : 0;

          updateText('runTimeValue', current);

          updateMultipleStateImagesView({
            id: 'runTimeProcess',
            visibleRatio,
          });
        };

        // Update background color
        const updateBackgroundColor = (id, hex) => {
            Object.entries(window.__effectColors || {}).forEach(([effectId, colors]) => {
              Object.entries(colors).forEach(([key, color]) => {
                if (color.fillMode !== 'sync_with_' + id) return;
                color.value = hex;
                document.querySelectorAll('[data-effect-color]').forEach(node => {
                  if (node.dataset.effect === effectId && node.dataset.effectColor === key) node.style.color = hex;
                });
              });
            });
            const el = findElement(id);
            if (el) {
                const textDiv = el.querySelector('div');
                if (textDiv) {
                    textDiv.style.background = hex;
                }
            }
            
            const syncEls = document.querySelectorAll(`.fill-mode-sync_with_${id}`);
            syncEls.forEach(syncEl => {
                syncEl.style.setProperty('--textColor', hex);
            });

            const syncBackgroundEls = document.querySelectorAll(`.background-color-mode-sync_with_${id}`);
            syncBackgroundEls.forEach(syncEl => {
                syncEl.style.backgroundColor = hex;
            });

            const syncBorderEls = document.querySelectorAll(`.border-color-mode-sync_with_${id}`);
            syncBorderEls.forEach(syncEl => {
              syncEl.style.borderColor = hex;
            });

            const els = document.querySelectorAll(`[class*="sync_with_${id}"]`); 
            const regex = new RegExp(`svg-(bg-)?fill-mode-([a-zA-Z0-9_-]+)-sync_with_${id}`, 'g');
            els.forEach(syncEl => {
              const syncElClassName = typeof syncEl.className === 'object' && syncEl.className.baseVal ? syncEl.className.baseVal : syncEl.className;
              const matches = syncElClassName.matchAll(regex);
              for (const match of matches) {
                if (!match) return;

                const [, bg, color] = match;

                setSvgColor(
                  syncEl,
                  color,
                  hex,
                  bg ? 'backgroundImage' : 'src'
                );
              }
            });
        };

        function getTextWidth(text, element) {
          const style = getComputedStyle(element);

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');

          const styleContext = [
            style.fontStyle,
            style.fontVariant,
            style.fontWeight,
            style.fontSize,
            style.fontFamily,
          ]
          context.font = styleContext.join(' ');

          return context.measureText(text).width;
        }

        // Update table data
        const originalFontSizes = {};
        const updateTableData = (id, data) => {
            holdFPS('updateTableData', expectedFPS);
            let parsedData = data;
            if (typeof data === 'string') {
                try {
                    parsedData = JSON.parse(data);
                } catch (e) {
                    console.warn("Invalid JSON data for table", id);
                    return;
                }
            }

            const divTable = findElement(id);
            const existingTable = divTable ? divTable.querySelector('table') : null;

            if (existingTable && Array.isArray(parsedData)) {
                const columns = Object.keys(parsedData[0] || {});

                // Determine if we need to split the table into two sections based on the number of rows and the data-table-wrap-after attribute
                const threshold = Math.max(1, Math.floor(Number(divTable.dataset.tableWrapAfter) || 7));
                const split = divTable.dataset.tableAutoWrap === 'true' && parsedData.length > threshold;
                const midpoint = split ? Math.ceil(parsedData.length / 2) : parsedData.length;
                const sections = split ? [parsedData.slice(0, midpoint), parsedData.slice(midpoint)] : [parsedData];

                // Create new tables for each section (without widths yet)
                const cellClass = existingTable.querySelector('td')?.className || '';
                const colElements = [];
                const tables = sections.map(rows => {
                  const colElementsOfSection = [];
                  const next = existingTable.cloneNode(false);
                  next.style.fontSize = '';

                  next.removeAttribute('id');
                  const colgroup = document.createElement('colgroup');
                  columns.forEach((col, index) => {
                    const colElement = document.createElement('col');
                    colgroup.appendChild(colElement);
                    colElementsOfSection.push(colElement);
                  });
                  colElements.push(colElementsOfSection);
                  next.appendChild(colgroup);
                  const body = document.createElement('tbody');
                  rows.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.style.height = divTable.clientHeight / Math.max(1, midpoint) + 'px';
                    columns.forEach(col => {
                      const td = document.createElement('td');
                      const span = document.createElement('span');
                      td.className = cellClass;
                      span.textContent = String(row[col] ?? '');
                      td.appendChild(span);
                      tr.appendChild(td);
                    });
                    body.appendChild(tr);
                  });
                  next.appendChild(body);
                  return next;
                });

                const maxLengthTexts = columns.map(
                  col => [...parsedData].sort(
                    (a, b) => String(b[col] ?? '').length - String(a[col] ?? '').length
                  )[0][col] ?? ''
                );
                const recalculateColumnWidths = (_table, _colElements, _maxLengthTexts) => {
                  const paddingSize = 40;
                  const naturalWidths = columns.map(
                    (col, index) => getTextWidth(_maxLengthTexts[columns.indexOf(col)], _table) + paddingSize
                  );

                  const remaining = naturalWidths.slice(1).reduce((sum, width) => sum + width, 0);
                  const eachTableActualWidth = divTable.clientWidth / sections.length;
                  const widths = naturalWidths.map(
                    (width, index) =>
                      index === 0
                        ? width
                        : (remaining ? width / remaining * Math.max(0, eachTableActualWidth - naturalWidths[0]) : width)
                  );
                  _colElements.forEach((colElementsOfSection, sectionIndex) => {
                    colElementsOfSection.forEach((colElement, colIndex) => {
                      colElement.style.width = widths[colIndex] + 'px';
                    });
                  });
                }

                divTable.querySelectorAll('table').forEach(node => node.remove());
                tables.forEach(node => divTable.appendChild(node));
                const firstTable = tables[0];
                recalculateColumnWidths(firstTable, colElements, maxLengthTexts);

                // auto-resize font size for all text elements in the table
                setTimeout(() => {
                  let startingFontSize = parseFloat(window.getComputedStyle(firstTable).fontSize);
                  const minFontSize = 8;
                  const maxIterations = 100;
                  if (!originalFontSizes[id]) {
                    originalFontSizes[id] = parseFloat(startingFontSize);
                  }

                  // Check height first
                  tables.forEach((_table) => {
                    let currentFontSize = startingFontSize;
                    let iterations = 0;

                    const animationTransformY = 12;
                    const deltaHeight = 1; // For some cases, the rounding of scrollHeight and clientHeight can cause the loop to not terminate, so we add a small delta to ensure it terminates.

                    while (
                      divTable.scrollHeight > divTable.clientHeight + animationTransformY + deltaHeight
                        && currentFontSize > minFontSize
                        && iterations < maxIterations
                    ) {
                      // Reduce font size by 1px each iteration
                      currentFontSize -= 1;
                      tables.forEach(node => { node.style.fontSize = currentFontSize + 'px'; });
                      recalculateColumnWidths(firstTable, colElements, maxLengthTexts);
                      
                      iterations++;
                    }

                    startingFontSize = currentFontSize;
                  });

                  // Check width next
                  const gap = tables.length > 1 ? 8 * (tables.length - 1) : 0;
                  let totalWidth = tables.reduce((sum, table) => sum + table.scrollWidth, gap);
                  let iterations = 0;
                  let currentFontSize = startingFontSize;
                  while (
                    totalWidth > divTable.clientWidth
                      && currentFontSize > minFontSize
                      && iterations < maxIterations
                  ) {
                    currentFontSize -= 1;

                    tables.forEach(node => { node.style.fontSize = currentFontSize + 'px'; });
                    recalculateColumnWidths(firstTable, colElements, maxLengthTexts);

                    totalWidth = tables.reduce((sum, table) => sum + table.scrollWidth, gap);
                    iterations++;
                  }
                }, 10);
            }

            // Sync lineupGameStage elements that have lineupSyncSource pointing to this table
            if (['teamALineup', 'teamBLineup', 'teamLineup'].includes(id) && Array.isArray(parsedData)) {
              syncLineupFromTable(id, parsedData);
            }
            setTimeout(() => {
              releaseFPS('updateTableData');
            }, 1000);
        };

        // Sync lineupGameStage players from a lineup table's data at runtime
        const lineupSyncThrottles = {};
        const LINEUP_PLAYER_APPEARANCE_DURATION_MS = 500;
        const LINEUP_PLAYER_APPEARANCE_STAGGER_MS = 80;

        const getPerspectiveCoord = (logicalX, logicalY, width, height, is3D) => {
          if (!is3D) {
            return {
              x: (logicalX / 100) * width,
              y: (logicalY / 100) * height,
            };
          }

          const yPct = logicalY / 100;
          const currentWidthPct = TOP_WIDTH_PERCENT + (1 - TOP_WIDTH_PERCENT) * yPct;
          const currentWidth = width * currentWidthPct;
          const xOffset = (width - currentWidth) / 2;

          return {
            x: xOffset + (logicalX / 100) * currentWidth,
            y: yPct * height,
          };
        };

        const buildFallbackPitchPositions = (count) => {
          if (count <= 0) return [];
          if (count === 1) return [{ x: 50, y: 88 }];

          const outfieldCount = count - 1;
          const maxPerRow = 4;
          const rowCount = Math.max(1, Math.ceil(outfieldCount / maxPerRow));
          const yStart = 74;
          const yEnd = 20;
          const yStep = rowCount > 1 ? (yStart - yEnd) / (rowCount - 1) : 0;

          const positions = [{ x: 50, y: 88 }];
          let assigned = 0;

          for (let rowIndex = 0; rowIndex < rowCount; rowIndex++) {
            const remaining = outfieldCount - assigned;
            const remainingRows = rowCount - rowIndex;
            const playersInRow = Math.ceil(remaining / remainingRows);
            const y = yStart - rowIndex * yStep;
            const xStart = 15;
            const xEnd = 85;
            const xStep = playersInRow > 1 ? (xEnd - xStart) / (playersInRow - 1) : 0;

            for (let i = 0; i < playersInRow; i++) {
              const x = playersInRow > 1 ? xStart + i * xStep : (xStart + xEnd) / 2;
              positions.push({ x, y });
              assigned += 1;
            }
          }

          return positions.slice(0, count);
        };

        const normalizeLineupNumber = (value, fallback, index) => {
          const parseNumber = (input) => {
            const matched = String(input || '').trim().match(/\d+/);
            return matched ? matched[0].padStart(2, '0') : null;
          };

          return (
            parseNumber(value) ||
            parseNumber(fallback) ||
            String(index + 1).padStart(2, '0')
          );
        };

        const getTableNumberValue = (row) => row?.number ?? row?.[0] ?? '';
        const getTableNameValue = (row) => row?.name ?? row?.[1] ?? '';

        const buildSyncedRuntimePlayers = (lineupEl, tableData) => {
          const existingPlayers = Array.isArray(lineupEl.lineupPlayers)
            ? lineupEl.lineupPlayers
            : [];
          const count = tableData.length;
          const group = RUNTIME_PITCH_FORMATIONS.find((g) => g.pitchSize === count);
          const nextFormation = group
            ? (
              lineupEl.lineupFormation && group.formations.includes(lineupEl.lineupFormation)
                ? lineupEl.lineupFormation
                : group.formations[0]
            )
            : undefined;

          let positions = null;
          if (nextFormation && RUNTIME_FORMATIONS[nextFormation]) {
            positions = RUNTIME_FORMATIONS[nextFormation];
          }
          if (!positions || positions.length !== count) {
            if (existingPlayers.length === count) {
              positions = existingPlayers.map((p) => ({ x: p.x, y: p.y }));
            }
          }

          if (!positions || positions.length !== count) {
            positions = buildFallbackPitchPositions(count);
          }

          const lineupPlayers = tableData.map((row, index) => {
            const prev = existingPlayers[index] || {};
            const pos = positions[index] || prev || { x: 50, y: 50 };
            const rawName = getTableNameValue(row);
            const rawNumber = getTableNumberValue(row);

            return {
              ...prev,
              id: prev.id || index + 1,
              name: rawName || prev.name || (index === 0 ? 'GK' : 'P' + (index + 1)),
              number: normalizeLineupNumber(rawNumber, prev.number, index),
              x: pos.x,
              y: pos.y,
              animation: prev.animation || 'none',
              isGoalkeeper: index === 0,
            };
          });

          return {
            lineupPlayers,
            lineupFormation: nextFormation,
          };
        };

        const rebuildLineupPlayersDom = (lineupEl, lineupPlayers) => {
          const container = findElement(lineupEl.id);
          if (!container) return;

          container
            .querySelectorAll('.' + lineupEl.id + '__player')
            .forEach((playerNode) => playerNode.remove());

          const stageWidth = Math.max(280, Number(lineupEl.width) || 820);
          const stageHeight = Math.max(180, Number(lineupEl.height) || 520);
          const is3D = lineupEl.viewMode !== '2d';

          lineupPlayers.forEach((player, index) => {
            const point = getPerspectiveCoord(
              player.x,
              player.y,
              stageWidth,
              stageHeight,
              is3D,
            );

            const playerWrapper = document.createElement('div');
            playerWrapper.className =
              lineupEl.id + '__player ' + lineupEl.id + '__player-' + player.id;
            playerWrapper.style.left = point.x + 'px';
            playerWrapper.style.top = point.y + 'px';

            const animator = document.createElement('div');
            const playerAppearanceClass =
              lineupEl.lineupPlayerAppearanceAnimation &&
              lineupEl.lineupPlayerAppearanceAnimation !== 'none'
                ? 'lineup-player-appearance--' + lineupEl.lineupPlayerAppearanceAnimation
                : '';
            animator.className =
              (lineupEl.id + '__player-animator ' + playerAppearanceClass).trim();
            const appearanceDelayMs = index * LINEUP_PLAYER_APPEARANCE_STAGGER_MS;
            animator.style.setProperty('--lineup-appearance-delay', appearanceDelayMs + 'ms');

            const loop = document.createElement('div');
            const animationClass =
              player.animation && player.animation !== 'none'
                ? 'lineup-player-animation--' + player.animation
                : '';
            loop.className = (lineupEl.id + '__player-loop ' + animationClass).trim();
            const loopDelayMs = playerAppearanceClass
              ? appearanceDelayMs + LINEUP_PLAYER_APPEARANCE_DURATION_MS
              : 0;
            loop.style.animationDelay = loopDelayMs + 'ms';

            const marker = document.createElement('div');
            marker.className =
              lineupEl.id + '__marker' +
              (player.isGoalkeeper ? ' ' + lineupEl.id + '__marker--goalkeeper' : '');

              if (!originalTextFontSizes[id]) {
                const computedStyle = window.getComputedStyle(targetDiv);
                originalTextFontSizes[id] = parseFloat(computedStyle.fontSize);
              }

              let newFontSize = resizeDivToFitText(targetDiv, originalTextFontSizes[id]);
              (MATCHING_SIZES[id] || []).forEach(matchId => {
                const _matchEl = findElement(matchId);
                if (!_matchEl) return;
                const matchEl = _matchEl.querySelector('span') || _matchEl.querySelector('div') || _matchEl;

                if (!originalTextFontSizes[matchId]) {
                  const computedStyle = window.getComputedStyle(matchEl);
                  originalTextFontSizes[matchId] = parseFloat(computedStyle.fontSize);
                }

                const minFontSize = Math.min(newFontSize, originalTextFontSizes[matchId]);
                newFontSize = Math.min(newFontSize, resizeDivToFitText(matchEl, minFontSize));
              });

              targetDiv.style.fontSize = `${newFontSize}px`;
              
              // Apply same font size to matching elements
              applySameFontSizeToMatches(newFontSize, MATCHING_SIZES[id] || []);
            }
          });
        };
        window.addEventListener('load', () => {
          checkOversizeText();
          checkOversizeLineupNames();
          hideAllMatchEventGroups();
          setMatchEventBackgroundVisible(false);
        });

        // Replay whatever the native side sent before the handlers above
        // existed, then tell it the overlay is ready. The app should wait for
        // this message before pushing state, but the replay keeps an early
        // push working either way.
        (() => {
          const queued = window.__templateQueue || [];
          window.__templateQueue = null;
          queued.forEach((call) => {
            try {
              window.template[call[0]].apply(window.template, call[1]);
            } catch (e) {
              console.warn('template replay failed', call[0], e);
            }
          });
          postToNative({ type: 'ready' });
        })();
    </script>

  #elements-container > .el-item, #elements-container > .background-overlay { visibility:hidden !important; }
  #pq { position:absolute; inset:0; z-index:5; color:#fff; font-family:'Noto Sans Lao','Phetsarath OT',sans-serif;
    --a:#1c5cd0; --b:#d6281e; --gold:#ffc21a; --bar:#0f141c; --bar2:#1b222d; --line:rgba(255,255,255,.09); --num:'Oswald','Noto Sans Lao',sans-serif; }
  #pq * { box-sizing:border-box; margin:0; padding:0; }
  #pq .tab { position:absolute; left:0; top:2px; height:22px; padding:0 12px; border-radius:10px 10px 0 0; background:var(--bar);
    font-size:14px; font-weight:900; line-height:22px; }
  #pq .tab b { color:var(--gold); font-weight:900; }
  #pq .card { position:absolute; left:0; top:24px; width:800px; height:115px; background:var(--bar); border-radius:0 12px 12px 12px; overflow:hidden; }
  #pq .row { position:absolute; left:0; width:800px; height:57px; }
  #pq .ra { top:0; --tc:var(--a); } #pq .rb { top:58px; --tc:var(--b); }
  #pq .row::before { content:""; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--tc); }
  #pq .sep { position:absolute; left:8px; right:0; top:57px; height:1px; background:var(--line); }
  #pq .row.win { background:linear-gradient(90deg, rgba(255,194,26,.22), transparent 70%); }
  #pq .logo { position:absolute; left:26px; top:6px; width:45px; height:45px; border-radius:50%; background:#fff center/cover no-repeat;
    box-shadow:0 0 0 2px rgba(255,255,255,.85); }
  #pq .nologo .logo { display:none; }
  #pq .name { position:absolute; left:95px; top:0; width:500px; height:57px; display:flex; align-items:center;
    font-size:30px; font-weight:900; line-height:1.3; white-space:nowrap; overflow:hidden; }
  #pq .nologo .name { left:24px; width:571px; }
  #pq .name span { display:block; transform-origin:0 50%; padding-block:2px; }
  #pq .jack { position:absolute; left:621px; top:17px; width:23px; height:23px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 0 2px #fff; transform:scale(0); transition:transform .3s cubic-bezier(.3,1.6,.6,1); }
  #pq .row.j .jack { transform:scale(1); }
  #pq .score { position:absolute; left:663px; top:5px; width:67px; height:47px; border-radius:9px; background:var(--tc);
    display:grid; place-items:center; font-family:var(--num); font-weight:700; font-size:40px; line-height:1; }
  #pq .score.pop { animation:pqpop .6s ease; }
  @keyframes pqpop { 0%{transform:scale(1)} 30%{transform:scale(1.22); box-shadow:0 0 0 3px var(--gold)} 100%{transform:scale(1)} }
  #pq .set { position:absolute; left:736px; top:5px; width:58px; height:47px; border-radius:9px; background:var(--bar2);
    display:grid; place-items:center; align-content:center; line-height:1; }
  #pq .set small { font-size:11px; font-weight:700; opacity:.6; }
  #pq .set b { font-family:var(--num); font-weight:700; font-size:26px; }
  #pq.nosets .set { opacity:0; }
  #pq .foot { position:absolute; left:16px; top:139px; height:24px; display:flex; gap:8px; }
  #pq .foot > span { background:var(--bar2); border-radius:0 0 9px 9px; padding:0 12px; font-size:14px; font-weight:700; line-height:24px; white-space:nowrap; }
  #pq .flash { background:var(--tc) !important; transform:translateY(-8px); opacity:0; transition:all .3s; }
  #pq .flash.on { transform:none; opacity:1; }
  #pq .flash b { font-family:var(--num); font-size:16px; margin-left:4px; }
  #pq .winmsg { background:var(--gold) !important; color:#1a1404; display:none; }
  #pq .winmsg.on { display:block; }
</style>
<script>
(() => {
  const TARGET = 13;          // ຄະແນນຊະນະ
  const MERGE_MS = 4000;      // ກົດ +1 ຕໍ່ກັນພາຍໃນ 4 ວິ = ຮອບດຽວກັນ
  const KEY = 'mee-petanque-livenow';
  const host = document.getElementById('elements-container');
  if (!host || !window.template || typeof window.template.update !== 'function') return;

  const box = document.createElement('div'); box.id = 'pq'; box.className = 'nosets';
  const row = (x) => `<div class="row r${x.toLowerCase()} nologo" id="pqRow${x}"><span class="logo" id="pqLogo${x}"></span><div class="name" id="pqName${x}"><span>ທີມ ${x}</span></div>
      <i class="jack"></i><div class="score" id="pqScore${x}">0</div><div class="set"><small>ນັດ</small><b id="pqSet${x}">0</b></div></div>`;
  box.innerHTML = `<div class="tab">ເປຕັ່ງ · <b>ເກມ ${TARGET}</b></div>
    <div class="card">${row('A')}<div class="sep"></div>${row('B')}</div>
    <div class="foot"><span id="pqEnd">ຮອບທີ 1</span><span class="flash" id="pqFlash"><span id="pqFName"></span><b id="pqFPts"></b></span><span class="winmsg" id="pqWin"></span></div>`;
  host.appendChild(box);
  const $ = (id) => document.getElementById(id);
  const X = (t) => (t ? 'B' : 'A');

  const S = { score: [0, 0], set: [0, 0], ends: [], turn: 0, seen: [false, false] };
  let burst = null, flashT = null;
  try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v && Array.isArray(v.ends)) S.ends = v.ends; } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ ends: S.ends })); } catch (e) {} };
  const name = (t) => $('pqName' + X(t)).textContent.trim() || 'ທີມ ' + X(t);
  const winner = () => S.score[0] >= TARGET ? 0 : S.score[1] >= TARGET ? 1 : null;
  const hold = (ms) => { try { window._holdFPS && window._holdFPS('pq', window._expectedFPS || 30); clearTimeout(hold.t); hold.t = setTimeout(() => window._releaseFPS && window._releaseFPS('pq'), ms); } catch (e) {} };

  function fit(t) {
    const w = $('pqName' + X(t)), sp = w.firstElementChild; sp.style.transform = '';
    const k = Math.min(1, (w.clientWidth - 4) / Math.max(1, sp.scrollWidth));
    if (k < 1) sp.style.transform = 'scaleX(' + Math.max(.55, k) + ')';
  }
  function render() {
    const w = winner();
    $('pqEnd').textContent = w === null ? 'ຮອບທີ ' + (S.ends.length + 1) : 'ຈົບເກມ · ' + S.ends.length + ' ຮອບ';
    $('pqWin').classList.toggle('on', w !== null);
    if (w !== null) $('pqWin').textContent = '🏆 ' + name(w) + ' ຊະນະ ' + S.score[w] + '–' + S.score[1 - w];
    const jt = S.turn || (S.ends.length ? S.ends[S.ends.length - 1].t + 1 : 0);
    [0, 1].forEach((t) => {
      $('pqRow' + X(t)).classList.toggle('win', w === t);
      $('pqRow' + X(t)).classList.toggle('j', w === null && jt === t + 1);
    });
    box.classList.toggle('nosets', !S.set[0] && !S.set[1]);
  }
  function setScore(t, v) {
    v = Math.max(0, parseInt(v, 10) || 0);
    const d = v - S.score[t], first = !S.seen[t]; S.seen[t] = true; S.score[t] = v;
    const el = $('pqScore' + X(t)); el.textContent = v;
    if (first) {
      const sum = S.ends.filter((e) => e.t === t).reduce((a, e) => a + e.p, 0);
      if (sum !== v) S.ends = S.ends.filter((e) => e.t !== t).concat(v ? [{ t, p: v }] : []);
    } else if (d > 0) {
      const last = S.ends[S.ends.length - 1];
      if (burst && burst.t === t && Date.now() - burst.at < MERGE_MS && last && last.t === t) last.p += d;
      else S.ends.push({ t, p: d });
      burst = { t, at: Date.now() };
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      const f = $('pqFlash'); f.style.setProperty('--tc', t ? 'var(--b)' : 'var(--a)');
      $('pqFName').textContent = name(t) + ' ໄດ້'; $('pqFPts').textContent = '+' + S.ends[S.ends.length - 1].p;
      f.classList.add('on'); clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('on'), 3500); hold(4000);
    } else if (d < 0) {
      let left = -d;
      for (let i = S.ends.length - 1; i >= 0 && left > 0; i--) {
        if (S.ends[i].t !== t) continue;
        const take = Math.min(left, S.ends[i].p); S.ends[i].p -= take; left -= take;
        if (!S.ends[i].p) S.ends.splice(i, 1);
      }
      burst = null; $('pqFlash').classList.remove('on');
    }
    if (!S.score[0] && !S.score[1]) S.ends = [];
    persist(); render();
  }
  function setLogo(t, v) {
    const url = String(v || '').trim();
    $('pqLogo' + X(t)).style.backgroundImage = url ? 'url("' + url.replace(/"/g, '%22') + '")' : 'none';
    $('pqRow' + X(t)).classList.toggle('nologo', !url); fit(t);
  }
  function feed(field, value) {
    switch (field) {
      case 'scoreA': setScore(0, value); break;
      case 'scoreB': setScore(1, value); break;
      case 'teamA': case 'teamB': { const t = field === 'teamB' ? 1 : 0; $('pqName' + X(t)).firstElementChild.textContent = String(value == null ? '' : value); fit(t); render(); break; }
      case 'logoA': case 'logoB': setLogo(field === 'logoB' ? 1 : 0, value); break;
      case 'setA': case 'setB': { const t = field === 'setB' ? 1 : 0; S.set[t] = parseInt(value, 10) || 0; $('pqSet' + X(t)).textContent = S.set[t]; render(); break; }
      case 'teamTurn': { const n = parseInt(value, 10) || 0; S.turn = n === 1 || n === 3 ? 1 : n === 2 || n === 4 ? 2 : 0; render(); break; }
    }
  }

  // ອ່ານຄ່າທີ່ແອັບສົ່ງມາແລ້ວ (ກ່ອນໂຄດນີ້ໂຫຼດ) ຈາກກາຟິກເດີມ
  const txt = (id) => { const el = document.getElementById(id); return el ? el.textContent.trim() : ''; };
  // ໂລໂກ້: ບໍ່ເອົາຮູບຕົວຢ່າງທີ່ມາກັບແມ່ແບບ
  const defSrc = (id) => { try { const e = (window.__INITIAL_STATE__.elements || []).find((x) => x.id === id); return e && e.src; } catch (e) { return null; } };
  const img = (id) => { const el = document.querySelector('#' + id + ' img'), s = el && el.getAttribute('src'); return s && s !== defSrc(id) ? s : ''; };
  feed('teamA', txt('teamA') || 'ທີມ A'); feed('teamB', txt('teamB') || 'ທີມ B');
  feed('logoA', img('logoA')); feed('logoB', img('logoB'));
  feed('setA', txt('setA')); feed('setB', txt('setB'));
  feed('scoreA', txt('scoreA')); feed('scoreB', txt('scoreB'));

  const orig = window.template.update;
  window.template.update = function (field, value) {
    try { orig.apply(this, arguments); } catch (e) { console.warn(e); }
    try { feed(field, value); } catch (e) { console.warn('petanque', e); }
  };
  if (document.fonts) document.fonts.ready.then(() => { fit(0); fit(1); });
  render();
})();
</script>
